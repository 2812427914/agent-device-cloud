name: Bug report
description: Report reproducible behavior that differs from the documented product contract.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use the private process in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what user workflow did it block?
      placeholder: Describe the observed behavior and impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest repeatable sequence using synthetic data.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Link the relevant documentation or describe the expected result.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Self-hosted
        - Hosted preview
        - Local development
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Connector platform
      options:
        - Not applicable
        - macOS arm64
        - macOS x64
        - Linux arm64
        - Linux x64
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Include error codes, invocation IDs and relevant logs. Remove credentials, private paths, file content and production URLs.
      render: shell
