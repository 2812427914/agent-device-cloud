# Docker Compose 2.24.4+ supports !override. Same identity and authorization code,
# with HTTP limited to loopback for local evaluation.
services:
  control-plane:
    environment:
      ADC_PUBLIC_URL: http://localhost:${ADC_HTTP_PORT:-8088}
      ADC_REQUIRE_EMAIL_VERIFICATION: "false"
  caddy:
    environment:
      ADC_SITE: ":80"
    ports: !override
      - "127.0.0.1:${ADC_HTTP_PORT:-8088}:80"
